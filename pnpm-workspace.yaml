# pnpm 11 配置文件
# pnpm 10+ 不再读取 package.json 的 pnpm 字段,改读这个文件
# 参考文档: https://pnpm.io/settings

# 声明这不是 monorepo(只有一个根包)
packages: ["."]

# 允许运行构建脚本的依赖(pnpm 11 用 allowBuilds)
# esbuild: 下载平台二进制文件
# @prisma/client / @prisma/engines / prisma: 生成 Prisma Client 引擎
# unrs-resolver: 编译原生模块
allowBuilds:
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  unrs-resolver: true
