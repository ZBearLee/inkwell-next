# GitHub Actions CI 工作流
#
# ==================== 工作流说明 ====================
#
# 触发条件:
#   1. push 到 master 分支 → 跑 CI + (Vercel 自动监听 push 触发部署)
#   2. pull_request 到 master 分支 → 只跑 CI,不部署
#
# CI 做什么:
#   1. 安装依赖(pnpm install)
#   2. 生成 Prisma Client(代码里 import 的是生成产物)
#   3. TypeScript 类型检查(tsc --noEmit)
#   4. ESLint 代码检查
#   5. Next.js 构建(next build,验证能产出生产包)
#
# CI 不做什么:
#   - 不部署(Vercel 监听 GitHub push 自动部署,不需要 Actions 介入)
#   - 不跑 prisma db push(避免 CI 改生产数据库)
#   - 不跑 seed(同上)
#
# ==================== Vercel 部署流程 ====================
#
# GitHub push → GitHub Actions 跑 CI(本文件)
#           → Vercel 监听 push,自动构建部署(并行,不等 CI 完成)
#
# 注意:Vercel 默认不等 CI 完成就部署。如果想让 Vercel 等 CI 通过再部署,
# 需要在 Vercel 项目设置 → Git → Ignored Build Step 配置,
# 或用 Vercel 的 GitHub Status Check 功能。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一时间只跑同一个 workflow,避免重复部署浪费资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest

    steps:
      # 1. 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 装 pnpm(版本和 package.json#packageManager 保持一致)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. 装 Node.js(pnpm 装好后,这步会自动读 package.json 的 packageManager)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4. 安装依赖
      #    --frozen-lockfile:严格按 pnpm-lock.yaml 装,不更新,保证一致性
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 生成 Prisma Client
      #    代码里 import { PrismaClient } from "@/generated/prisma"
      #    这个产物是 prisma generate 生成的,不在 git 里,必须每次 CI 重新生成
      - name: Generate Prisma Client
        run: pnpm db:generate

      # 6. TypeScript 类型检查
      #    --noEmit:只检查类型,不产出 .js 文件
      - name: Type check
        run: pnpm exec tsc --noEmit

      # 7. ESLint 检查
      - name: Lint
        run: pnpm lint

      # 8. Next.js 构建
      #    验证能产出生产包,不部署(Vercel 负责部署)
      #    需要环境变量:Next.js 构建时会预渲染静态页面,可能查数据库
      #    用空值占位,避免构建报错(运行时 Vercel 会注入真实值)
      - name: Build
        run: pnpm build
        env:
          # 构建期不需要真实数据库,用占位符避免报错
          # 静态页面生成如果查数据库会失败,但不会阻断构建(动态路由会 fallback)
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          AUTH_SECRET: "placeholder-secret-for-build-only-not-used-at-runtime"
          AUTH_URL: "https://example.com"
          NEXTAUTH_URL: "https://example.com"
